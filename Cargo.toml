[workspace]
members = [
    "orbital_basis",
    "cuda_kernels",
    "nbody_integrator",
    "curve_fitter", "data_io",
]
resolver = "2"

[workspace.package]
version  = "0.1.0"
edition  = "2021"
authors  = ["horb contributors"]

[workspace.dependencies]
nalgebra    = "0.33"
num-complex = "0.4"
num-traits  = "0.2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
anyhow      = "1"
approx      = "0.5"
